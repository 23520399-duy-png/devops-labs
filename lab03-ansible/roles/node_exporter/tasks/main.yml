---
- name: User hệ thống cho node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Kiểm tra phiên bản đang cài
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_current
  changed_when: false
  failed_when: false

- name: Tải và cài node_exporter (chỉ khi khác phiên bản)
  when: node_exporter_version not in (node_exporter_current.stderr | default('') + node_exporter_current.stdout | default(''))
  block:
    - name: Tải bản phát hành (có kiểm tra checksum SHA256)
      ansible.builtin.get_url:
        url: "{{ node_exporter_base_url }}/{{ node_exporter_pkg }}.tar.gz"
        dest: "/tmp/{{ node_exporter_pkg }}.tar.gz"
        checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
        mode: "0644"

    - name: Giải nén
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_pkg }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Cài binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_pkg }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

- name: Đảm bảo thư mục unit systemd tồn tại
  ansible.builtin.file:
    path: /etc/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unit systemd (có sandboxing)
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Bật và chạy node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  when: has_systemd and not is_container
