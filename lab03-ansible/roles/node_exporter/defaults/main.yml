---
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] | default('amd64') }}"
node_exporter_pkg: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
