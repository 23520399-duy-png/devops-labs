---
- name: Cài dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Chỉ áp dụng bản vá bảo mật
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { option: upgrade_type, value: security }
    - { option: apply_updates, value: "yes" }

- name: Bật timer dnf-automatic
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when: has_systemd and not is_container
