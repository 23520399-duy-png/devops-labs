apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Cấm tag latest / không có tag
    policies.kyverno.io/description: Tag "latest" làm mất khả năng biết đang chạy bản nào và rollback.
spec:
  background: true
  rules:
    - name: require-explicit-tag
      match:
        any:
          - resources: { kinds: [Pod], namespaces: ["shop-*"] }
      validate:
        failureAction: Enforce
        message: "Image phải có tag cụ thể và không được là ':latest'."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ contains(element.image, ':') || contains(element.image, '@') }}"
                    operator: Equals
                    value: false
