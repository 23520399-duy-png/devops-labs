apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopmini
automountServiceAccountToken: false   # app không gọi Kubernetes API → không cần token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopmini-config
data:
  LOG_LEVEL: INFO
  CACHE_TTL_SECONDS: "30"
  WORKERS: "1"                        # 1 worker/pod – scale bằng số pod (HPA), không bằng worker
  CHAOS_ENABLED: "false"
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmini
  labels: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # không bao giờ giảm số pod sẵn sàng khi deploy
      maxSurge: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: shopmini
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: shopmini            # tag/registry được kustomize thay ở overlay
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: shopmini-config }
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/version']" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: shopmini-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopmini-db, key: password } }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/shop
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          startupProbe:                       # cho app tối đa 60s để khởi động
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:                     # có nhận traffic không (kiểm tra DB + Redis)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:                      # có cần restart không (chỉ kiểm tra process)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:                          # chờ Endpoint/ingress cập nhật trước khi dừng → không rớt request
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shopmini
  labels: { app.kubernetes.io/name: shopmini }
spec:
  selector: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopmini
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: shopmini, app.kubernetes.io/component: api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopmini
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shopmini }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # tránh "nhấp nháy" scale up/down
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopmini
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.127.0.0.1.nip.io       # nip.io: tên miền luôn phân giải về 127.0.0.1
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: shopmini, port: { name: http } }
