apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: shopmini
    newName: ghcr.io/YOUR_GITHUB_USER/shopmini   # image từ Lab 04 (package public)
    newTag: "1.0.0"
secretGenerator:
  - name: shopmini-db
    envs: [db.env]
patches:
  - target: { kind: HorizontalPodAutoscaler, name: shopmini }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target: { kind: PodDisruptionBudget, name: shopmini }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target: { kind: Deployment, name: shopmini }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1version
        value: "1.0.0"
  - target: { kind: Ingress, name: shopmini }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop-prod.127.0.0.1.nip.io
