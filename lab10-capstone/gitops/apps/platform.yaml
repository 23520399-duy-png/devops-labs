# Nền tảng của cluster k3s trên AWS – mọi thứ do Argo CD cài từ Git (không helm install tay).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.*
    helm:
      valuesObject:
        controller:
          service: { type: LoadBalancer }      # k3s ServiceLB gắn port 80/443 lên IP của node
          metrics: { enabled: true, serviceMonitor: { enabled: false } }
          resources: { requests: { cpu: 100m, memory: 128Mi } }
  destination: { server: https://kubernetes.default.svc, namespace: ingress-nginx }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.*
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      valuesObject:
        fullnameOverride: kps
        grafana:
          adminPassword: change-me-capstone     # TODO: chuyển sang SealedSecret (admin.existingSecret)
          ingress: { enabled: true, ingressClassName: nginx, hosts: ["grafana.EIP_PLACEHOLDER.nip.io"] }
          sidecar: { dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL } }
        prometheus:
          prometheusSpec:
            retention: 2d
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources: { requests: { cpu: 100m, memory: 400Mi }, limits: { memory: 1Gi } }
        alertmanager: { enabled: true }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeEtcd: { enabled: false }
        kubeProxy: { enabled: false }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopmini
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/devops-labs.git
    targetRevision: main
    path: lab10-capstone/gitops/envs/aws
  destination: { server: https://kubernetes.default.svc, namespace: shop-prod }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
