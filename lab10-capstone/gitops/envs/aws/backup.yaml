# Backup logic Postgres → S3 mỗi 15 phút. Credential AWS lấy từ instance profile của node (IMDSv2, hop limit 2).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app.kubernetes.io/name: pg-backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: postgres:16-alpine
              securityContext:
                runAsUser: 70
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              env:
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: shopmini-db, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: shopmini-db, key: password } }
              command: ["sh", "-c"]
              args:
                - pg_dump -h postgres -d shop --clean --if-exists --no-owner | gzip > /backup/shop-$(date -u +%Y%m%dT%H%M%SZ).sql.gz && ls -l /backup
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.0
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              envFrom: [{ configMapRef: { name: backup-config } }]
              env: [{ name: HOME, value: /tmp }]
              command: ["sh", "-c"]
              args:
                - aws s3 cp /backup/ "s3://$BACKUP_BUCKET/db/" --recursive --sse AES256 && echo "uploaded"
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: backup, emptyDir: {} }
            - { name: tmp, emptyDir: {} }
---
# Default-deny (Lab 05) chặn mọi egress → mở đúng các luồng job backup cần
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-backup-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pg-backup }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ ipBlock: { cidr: 169.254.169.254/32 } }]     # IMDS → credential của LabInstanceProfile
      ports: [{ protocol: TCP, port: 80 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [10.0.0.0/8] } }]   # S3 (HTTPS)
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-from-backup
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: pg-backup } } }]
      ports: [{ protocol: TCP, port: 5432 }]
