# Thêm thư mục lab07-observability/k8s vào resources của gitops/envs/<env>/kustomization.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopmini
  labels: { app.kubernetes.io/name: shopmini }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: shopmini }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
---
# Cho Prometheus (namespace monitoring) scrape pod api – default-deny của Lab 05 đang chặn
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-from-monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ protocol: TCP, port: 8000 }]
