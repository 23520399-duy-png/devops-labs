apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - namespace.yaml
  - ../../../../lab05-kubernetes/k8s/base   # dùng lại base của Lab 05 – một nguồn sự thật
  - sealed-db.yaml                           # tạo bằng scripts/seal-db-secret.sh (đã mã hóa → commit được)
images:
  - name: shopmini
    newName: ghcr.io/YOUR_GITHUB_USER/shopmini
    newTag: "1.0.0"                          # workflow cd-bump.yml tự cập nhật dòng này
patches:
  - target: { kind: ConfigMap, name: shopmini-config }
    patch: |-
      - op: replace
        path: /data/CHAOS_ENABLED
        value: "true"
  - target: { kind: Deployment, name: shopmini }
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1version
        value: dev
