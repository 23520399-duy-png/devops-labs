worker_processes auto;
events { worker_connections 1024; }

http {
  # Log JSON để sau này đưa vào Loki/CloudWatch dễ phân tích
  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"urt":"$upstream_response_time","rid":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;                                   # ẩn version nginx
  gzip on;
  gzip_types application/json text/plain;

  # Rate limit: 100 req/s mỗi IP, burst 100 (k6 chạy từ 1 IP nên không đặt quá thấp)
  limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;
  limit_req_status 429;

  upstream api {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 8080;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # /metrics chỉ dành cho Prometheus trong mạng nội bộ – không public
    location = /metrics { return 404; }
    location /chaos     { allow 127.0.0.1; deny all; proxy_pass http://api; }

    location / {
      limit_req zone=perip burst=100 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }
  }
}
